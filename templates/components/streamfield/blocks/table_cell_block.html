{% load wagtailcore_tags wagtailimages_tags i18n %}

<div class="relative" data-table-cell>
    <button
        type="button"
        class="group flex items-center justify-center w-full aspect-square p-6 md:p-8 cursor-pointer"
        data-modal-trigger
        aria-haspopup="dialog"
    >
        {% if value.image %}
            {% image value.image max-400x400 format-png as cell_image %}
            <img
                src="{{ cell_image.url }}"
                width="{{ cell_image.width }}"
                height="{{ cell_image.height }}"
                alt="{% firstof value.image.contextual_alt_text cell_image.alt %}"
                class="w-full h-full object-contain transition-transform duration-300 ease-in-out group-hover:scale-105"
            />
        {% endif %}
    </button>

    <dialog
        class="p-0 m-auto border-0 rounded-md w-[90vw] max-w-lg text-white bg-m4n-neutral backdrop:bg-m4n-neutral/70"
        data-modal
    >
        <div class="relative p-6 md:p-10">
            <button
                type="button"
                class="absolute top-5 right-5 w-8 h-8 rounded-full  flex items-center justify-center cursor-pointer"
                data-modal-close
                aria-label="Close"
            >
                <svg width="12" height="12" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.5" />
                </svg>
            </button>
            {% if value.heading %}
                <h3 class="text-xl md:text-2xl font-semibold font-serif4 pr-8 mb-3">{{ value.heading }}</h3>
            {% endif %}
            {% if value.paragraph %}
                <div class="text-base md:text-lg">
                    {{ value.paragraph }}
                </div>
            {% endif %}
            {% if value.link %}
                <a
                    href="{{ value.link }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="mt-6 inline-flex whitespace-nowrap rounded-4xl text-sm font-bold font-serif4 ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-white text-m4n-neutral hover:bg-m4n-neutral hover:text-white border hover:border-white h-10 px-6 py-2 duration-500 w-fit"
                >
                    <div class="flex flex-row gap-5 items-center">
                        {% translate "Visit Website" %}
                        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 448 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"></path></svg>
                    </div>
                </a>
            {% endif %}
        </div>
    </dialog>
</div>
