{% load wagtailcore_tags %}

<div class="border-t border-white/20 last:border-b py-6 md:py-8">
    {% if number %}
        <p class="text-lg font-sans tracking-widest text-white mb-2">{{ number|stringformat:"02d" }}</p>
    {% endif %}
    <button
        type="button"
        class="group peer flex items-center gap-4 w-full text-left cursor-pointer"
        data-accordion-toggle
        aria-expanded="false"
    >
        {% if value.heading %}
            <h3 class="text-2xl lg:text-5xl font-semibold font-serif4 min-w-0">{{ value.heading }}</h3>
        {% endif %}
        <span
            class="ml-auto shrink-0 w-9 h-9 md:w-10 md:h-10 rounded-full border border-current flex items-center justify-center transition-transform duration-300 ease-in-out group-aria-expanded:rotate-45"
            aria-hidden="true"
        >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 0V14M0 7H14" stroke="currentColor" stroke-width="1.5" />
            </svg>
        </span>
    </button>
    {% if value.description %}
        <div class="grid grid-rows-[0fr] peer-aria-expanded:grid-rows-[1fr] transition-[grid-template-rows] duration-500 ease-in-out">
            <div class="overflow-hidden">
                <div class="text-lg md:text-xl pt-4 font-sans">
                    {{ value.description|richtext }}
                </div>
            </div>
        </div>
    {% endif %}
</div>
