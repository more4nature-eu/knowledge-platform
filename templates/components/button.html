

{% if url %}
    <a
        href="{{ url }}"
        {% if block_type == 'external' %}
        target="_blank"
        {% endif %}
        class="
        {{ classes }}
        {% if variant == 'footer' %}
            md:px-5
        {% else %}
            md:px-10
        {% endif %}
        text-m4n-neutral bg-white
        hover:bg-m4n-neutral
        hover:text-white
        duration-500
        border
        border-m4n-neutral
        hover:border-white
        px-5 py-2
        text-nowrap
        justify-center items-center
        text-sm md:text-base
        font-sans uppercase inline-flex rounded-full">
        {% if arrow %}
        <div class="flex flex-row gap-5 items-center">
        {% endif %}
        {{ title }}
        {% if arrow %}
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 448 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"></path></svg>
        </div>
        {% endif %}
    </a>
{% else %}
    <button
        class="
        {{ classes }}
        {% if variant == 'footer' %}
            md:px-5
        {% else %}
            md:px-10
        {% endif %}
        text-m4n-neutral bg-white
        hover:bg-m4n-neutral
        hover:text-white
        duration-500
        border
        border-m4n-neutral
        hover:border-white
        px-5 py-2
        justify-center items-center text-sm md:text-base font-sans uppercase inline-flex rounded-full">
        {% if arrow %}
        <div class="flex flex-row gap-5 items-center">
        {% endif %}
        {{ title }}
        {% if arrow %}
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 448 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"></path></svg>
        </div>
        {% endif %}
    </button>
{% endif %}
